name: Docker (GHCR)

# master 收到 push（含 sync-upstream 定时同步产生的 push）后自动构建
# 多架构镜像并推送到 ghcr.io/sakezerto/aistudio-api。
# github.repository 会自动解析为当前 fork（sakezerto/aistudio-api），无需硬编码 owner。
# 只用内置 GITHUB_TOKEN，无需任何 Secrets。

on:
  push:
    branches:
      - master
  # 手动触发：Actions 页 → Docker (GHCR) → Run workflow，
  # 可只改平台、可只构建不推送（校验 Dockerfile 用）。
  workflow_dispatch:
    inputs:
      platforms:
        description: "目标平台（逗号分隔）"
        required: false
        default: "linux/amd64,linux/arm64"
      push_image:
        description: "是否推送镜像（取消勾选则仅构建校验）"
        type: boolean
        required: false
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  GHCR_REPO: ghcr.io/${{ github.repository }}

jobs:
  docker:
    name: Build and push (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value={{date 'YYYYMMDD'}}-sha-{{sha}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' || inputs.push_image != false }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Docker 构建结果"
            echo ""
            echo "- **commit**: \`${{ github.sha }}\`"
            echo "- **digest**: \`${{ steps.build.outputs.digest }}\`"
            echo "- **platforms**: \`${{ inputs.platforms || 'linux/amd64,linux/arm64' }}\`"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "> 拉取：\`docker pull ${{ env.GHCR_REPO }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failure notice
        if: failure()
        shell: bash
        run: |
          {
            echo "### 构建失败"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- 排查方向：Dockerfile / requirements / waa-signer 构建脚本是否随上游变更而失效。"
            echo "- 失败只记录在此 summary，不开 issue、不碰上游仓库。"
          } >> "$GITHUB_STEP_SUMMARY"
