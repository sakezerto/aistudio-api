name: Docker (GHCR)

# 云编译工作流：只推送到 ghcr.io/<owner>/aistudio-api
# 不需要 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 等 Secrets，使用内置 GITHUB_TOKEN。
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "目标平台（逗号分隔）"
        required: false
        default: "linux/amd64,linux/arm64"
      push_image:
        description: "是否推送镜像（取消勾选则仅构建校验）"
        type: boolean
        required: false
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_REPO: ghcr.io/${{ github.repository }}

jobs:
  docker:
    name: Build and Push Docker Image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'master' || github.ref_name == 'main' }}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=build-{{date 'YYYYMMDD-HHmm'}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' || inputs.push_image != false }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Docker 构建完成 :whale:"
            echo ""
            echo "- **commit**: \`${{ github.sha }}\`"
            echo "- **digest**: \`${{ steps.build.outputs.digest }}\`"
            echo "- **platforms**: \`${{ inputs.platforms || 'linux/amd64,linux/arm64' }}\`"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
